name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["build-apk"]
    paths:
      - "App.tsx"
      - "app.json"
      - "package.json"
      - "tsconfig.json"
      - "src/**"
      - ".github/workflows/build-apk.yml"
      - ".github/BUILD_APK_TRIGGER.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          tools: platform-tools
          packages: platforms;android-36
      - name: Install JavaScript dependencies
        run: npm install
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone release APK with embedded JavaScript
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/release/app-release.apk
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: brain-lab-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
